name: ci-cd
on:
  push:
    branches:
      - main

jobs:
  build and deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v6

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: login to docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fittracker:latest

      - name: Connect to AWS EC2
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}


          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/fittracker:latest
            docker stop fittracker || true
            docker rm fittracker || true
            docker run -d --name fittracker -p 80:5000 ${{ secrets.DOCKER_USERNAME }}/fittracker:latest

            echo "Deployment complete!"



