name: FitTrack CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Get code from GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v6


      # 2. Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # 3. Install project dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # 5. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # 6. Build Docker image and push to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fittrack:latest


      # 7. Connect to AWS EC2
      #    Pull new image
      #    Stop old container
      #    Remove old container
      #    Run new container
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "Pulling latest Docker image..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/fittrack:latest

            echo "Stopping old container..."
            sudo docker stop fittrack || true

            echo "Removing old container..."
            sudo docker rm fittrack || true

            echo "Starting new container..."
            sudo docker run -d \
              --name fittrack \
              --restart unless-stopped \
              -p 80:5000 \
              ${{ secrets.DOCKER_USERNAME }}/fittrack:latest

            echo "Deployment complete!"